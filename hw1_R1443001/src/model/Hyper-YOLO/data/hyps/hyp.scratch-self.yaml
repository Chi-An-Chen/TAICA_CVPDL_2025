# ============================================
# 豬隻檢測專用超參數配置 (AdamW 優化器)
# 任務特性：
# - 俯視監視器視角
# - 白天(彩色) + 夜間(灰階)雙模式
# - 密集小目標檢測
# - 豬隻遮擋、重疊嚴重
# 優化器：AdamW (更穩定收斂，推薦小數據集使用)
# ============================================

# ========== 學習率策略 (AdamW) ==========
lr0: 0.001           # 初始學習率 (0.01→0.001，AdamW 需要更小的學習率)
lrf: 0.01            # 最終學習率倍數 (0.1→0.01，AdamW 可以降更低)
momentum: 0.9        # Adam beta1 (0.937→0.9，標準值)
weight_decay: 0.05   # 權重衰減 (0.0005→0.05，AdamW 需要更大的衰減)
warmup_epochs: 3.0   # 熱身輪數 (保持不變)
warmup_momentum: 0.9 # 熱身初始 beta1 (0.8→0.9)
warmup_bias_lr: 0.1  # 熱身偏置學習率 (保持不變)

# ========== 損失函數權重 ==========
box: 7.5             # 邊界框損失權重 (保持不變)
cls: 0.5             # 分類損失權重 (單類別，保持較低)
cls_pw: 1.0          # 分類正樣本權重 (保持不變)
obj: 1.0             # 目標置信度損失 (0.7→1.0，提升小目標檢測)
obj_pw: 1.0          # 目標正樣本權重 (保持不變)
dfl: 1.5             # DFL損失權重 (保持不變，精確定位)
iou_t: 0.20          # IoU訓練閾值 (保持不變)
anchor_t: 5.0        # 錨框倍數閾值 (保持不變)
fl_gamma: 0.0        # Focal Loss gamma (保持0，單類別無需)

# ========== 色彩空間增強 (HSV) ==========
# 關鍵調整：因為夜間是灰階，要降低色彩相關增強
hsv_h: 0.01          # 色調 (0.015→0.01，減弱，夜間無色彩)
hsv_s: 0.35           # 飽和度 (0.7→0.3，大幅降低！避免破壞灰階特性)
hsv_v: 0.5           # 明度 (0.4→0.5，提高，適應光照變化)

# ========== 幾何變換增強 ==========
degrees: 5.0         # 旋轉角度 (0→5度，輕微旋轉模擬視角變化)
translate: 0.15      # 平移 (0.1→0.15，增加位置變化)
scale: 0.6           # 縮放 (0.5→0.6，模擬豬隻大小變化)
shear: 2.0           # 剪切 (0→2度，輕微剪切模擬視角)
perspective: 0.0002  # 透視變換 (0→0.0002，模擬不同攝影機角度)

# ========== 翻轉增強 ==========
flipud: 0.0          # 上下翻轉 (保持0，俯視場景不適合)
fliplr: 0.5          # 左右翻轉 (保持0.5，豬舍對稱佈局可用)

# ========== 混合增強策略 ==========
# 關鍵調整：降低 Mosaic，避免破壞場景完整性
mosaic: 0.5          # Mosaic (1.0→0.5，密集目標容易混淆)
mixup: 0.05          # MixUp (0→0.05，輕度使用增強泛化)
copy_paste: 0.0      # Copy-Paste (保持0，豬隻重疊不自然)

# ========== 針對性建議 (AdamW) ==========
# 1. 如果白天效果差：提高 hsv_h, hsv_s 到 0.02, 0.5
# 2. 如果夜間效果差：確認已使用 CLAHE 預處理
# 3. 如果小豬漏檢：提高 obj 到 1.2，降低 conf 到 0.2
# 4. 如果訓練不穩定：降低 lr0 到 0.0005
# 5. 如果過擬合嚴重：提高 weight_decay 到 0.1
# 6. 如果收斂太慢：提高 lr0 到 0.002 (AdamW 可以用較大學習率)
# 7. AdamW 優勢：對學習率不敏感，可以嘗試 0.0005~0.003 範圍